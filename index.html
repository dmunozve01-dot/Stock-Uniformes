<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login | Grupo ANC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/main.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand-logo">
      <img src="./assets/logo.png" alt="Grupo ANC" onerror="this.src='https://via.placeholder.com/180x60/ffffff/D81B60?text=Grupo+ANC'">
    </div>
    <h2>Control de Uniformes</h2>
    <p>Ingresa con tu cuenta corporativa</p>

    <div class="google-btn-wrapper" id="googleBtnContainer">
      <div style="color: #64748b; font-size: 0.85rem;">Cargando Google Sign-In...</div>
    </div>

    <div class="remember-option">
      <input type="checkbox" id="rememberMe">
      <label for="rememberMe">Mantener sesión iniciada</label>
    </div>

    <!-- BOTÓN DE SOLICITAR ACCESO -->
    <div style="margin-top: 20px; border-top: 1px dashed var(--border-color); padding-top: 20px;">
      <p style="font-size: 0.85rem; color: var(--text-gray); margin-bottom: 10px;">¿No tienes acceso al sistema?</p>
      <button class="btn btn-secondary-login" type="button" id="btnRequestAccess" style="border-color: var(--neon-cyan); color: var(--neon-cyan);">
        <i class="fa-solid fa-envelope"></i> Solicitar Acceso
      </button>
    </div>
  </div>

  <!-- MODAL DE SOLICITUD -->
  <div id="modalRequest" class="hidden modal-overlay">
    <div class="card" style="width:90%; max-width:400px;">
      <h3 style="color: var(--neon-cyan); margin-bottom: 15px;">Solicitar Acceso</h3>
      <p style="font-size: 0.85rem; color: var(--text-gray); margin-bottom: 20px;">
        Ingresa tus datos. Se enviará una notificación al administrador para que autorice tu cuenta.
      </p>
      
      <div class="form-group" style="margin-bottom: 15px;">
        <label>Correo Electrónico</label>
        <input type="email" id="reqEmail" placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="form-group" style="margin-bottom: 25px;">
        <label>Nombre Completo</label>
        <input type="text" id="reqName" placeholder="Ej: Juan Pérez">
      </div>
      
      <div style="display:flex; gap:10px;">
        <button class="btn btn-cancel" id="btnCancelRequest" style="flex:1;">Cancelar</button>
        <button class="btn btn-primary" id="btnSendRequest" style="flex:1;">Enviar Solicitud</button>
      </div>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"></script>
  <script src="./js/core/apiService.js"></script>
  <script src="./js/auth.js"></script>

  <script>
    function initGoogleSignIn() {
      if (typeof google === 'undefined' || !APP_CONFIG.GOOGLE_CLIENT_ID) {
        document.getElementById('googleBtnContainer').innerHTML = 
          '<div style="color: #dc2626; font-size: 0.85rem;">Error al cargar Google</div>';
        return;
      }

      google.accounts.id.initialize({
        client_id: APP_CONFIG.GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById('googleBtnContainer'),
        { type: 'standard', shape: 'pill', theme: 'outline', text: 'signin_with', size: 'large', width: 280 }
      );
    }

    document.addEventListener('DOMContentLoaded', () => {
      const user = sessionStorage.getItem('sw_user') || localStorage.getItem('sw_user');
      if (user) window.location.replace('app.html');

      // Lógica del modal de solicitud
      const modal = document.getElementById('modalRequest');
      document.getElementById('btnRequestAccess').addEventListener('click', () => {
        modal.classList.remove('hidden');
      });
      document.getElementById('btnCancelRequest').addEventListener('click', () => {
        modal.classList.add('hidden');
      });
      
      document.getElementById('btnSendRequest').addEventListener('click', async () => {
        const email = document.getElementById('reqEmail').value.trim();
        const nombre = document.getElementById('reqName').value.trim();
        
        if (!email || !nombre) return alert("Por favor, complete todos los campos.");
        
        const btn = document.getElementById('btnSendRequest');
        btn.disabled = true;
        btn.innerHTML = 'Enviando...';

        const success = await apiService.solicitarAcceso(email, nombre);
        
        if (success) {
          alert("✅ Solicitud enviada. El administrador revisará tu caso pronto.");
          modal.classList.add('hidden');
          document.getElementById('reqEmail').value = '';
          document.getElementById('reqName').value = '';
        } else {
          alert("❌ Error al enviar la solicitud. Intente más tarde.");
        }
        
        btn.disabled = false;
        btn.innerHTML = 'Enviar Solicitud';
      });
    });
  </script>
</body>
</html>
