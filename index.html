<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stock Uniformes - Grupo ANC</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/main.css">
</head>
<body class="login-body">
  <div class="login-card">
    
    <!-- LOGO DE LA EMPRESA -->
    <div class="brand-logo">
      <!-- Asegúrate de que la ruta de la imagen sea correcta en tu proyecto -->
      <img src="./assets/logo.png" alt="Grupo ANC">
    </div>
    
    <h2>Control de Uniformes</h2>
    <p>Ingresa con tu cuenta corporativa</p>

    <!-- Contenedor del botón de Google -->
    <div class="google-btn-wrapper" id="googleBtnContainer">
      <div style="color: #64748b; font-size: 0.85rem;">Cargando Google Sign-In...</div>
    </div>

    <div class="remember-option">
      <input type="checkbox" id="rememberMe">
      <label for="rememberMe">Mantener sesión iniciada</label>
    </div>
    
    <div class="divider"><span>o</span></div>
    
    <button class="btn-secondary-login" type="button" id="btnDemoLogin">
      <i class="fa-solid fa-user-gear"></i> Entrar como Demo
    </button>
  </div>

  <script src="./js/config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"></script>
  <script src="./js/core/apiService.js"></script>
  <script src="./js/auth.js"></script>

  <script>
    function initGoogleSignIn() {
      if (typeof google === 'undefined' || !APP_CONFIG.GOOGLE_CLIENT_ID) {
        document.getElementById('googleBtnContainer').innerHTML = 
          '<div style="color: #dc2626; font-size: 0.85rem;">Error de configuración de Google</div>';
        return;
      }

      google.accounts.id.initialize({
        client_id: APP_CONFIG.GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById('googleBtnContainer'),
        { 
          type: 'standard', 
          shape: 'pill', /* Botón más redondeado, estilo moderno */
          theme: 'outline', 
          text: 'signin_with', 
          size: 'large',
          width: 280
        }
      );
    }

    document.addEventListener('DOMContentLoaded', () => {
      const user = sessionStorage.getItem('sw_user') || localStorage.getItem('sw_user');
      if (user) window.location.replace('app.html');
    });
  </script>
</body>
</html>
