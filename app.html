<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartWarehouse - Control de Stock</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Cabecera de Usuario -->
    <div class="user-profile">
      <img id="userAvatar" src="" alt="Avatar" class="avatar">
      <div class="user-info">
        <strong id="userName">...</strong>
        <span id="userEmail" class="email">...</span>
      </div>
      <button class="btn-logout" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
    </div>

    <!-- Pestañas -->
    <div class="mode-switch">
      <button id="btnUser" class="btn-tab active"><i class="fa-solid fa-boxes-stacked"></i> Inventario</button>
      <button id="btnAdmin" class="btn-tab hidden"><i class="fa-solid fa-user-gear"></i> Gestión y Entregas</button>
    </div>

    <!-- PANEL OPERARIO (Solo lectura) -->
    <section id="userPanel" class="panel active">
      <div class="card">
        <h3><i class="fa-solid fa-boxes-stacked"></i> Stock Disponible</h3>
        <div class="table-responsive">
          <table id="tableInventoryUser" class="data-table">
            <thead>
              <tr><th>Tipo</th><th>Talla</th><th>Color</th><th>Stock</th><th>Ubicación</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- PANEL ADMINISTRADOR -->
    <section id="adminPanel" class="panel">
      
      <!-- Formulario de Entrega -->
      <div class="card" style="margin-bottom: 20px;">
        <h3><i class="fa-solid fa-hand-holding"></i> Registrar Entrega de Uniforme</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Email del Empleado</label>
            <input type="email" id="deliveryUserEmail" placeholder="empleado@empresa.com">
          </div>
          <div class="form-group">
            <label>Uniforme</label>
            <select id="deliveryItemSelect"></select>
          </div>
          <div class="form-group" style="max-width: 100px;">
            <label>Cantidad</label>
            <input type="number" id="deliveryQty" value="1" min="1">
          </div>
          <div class="form-group" style="display: flex; align-items: flex-end;">
            <button class="btn btn-primary" id="btnDeliverItem"><i class="fa-solid fa-check"></i> Entregar</button>
          </div>
        </div>
      </div>

      <!-- Tabla de Historial -->
      <div class="card">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Historial de Entregas</h3>
        <div class="table-responsive">
          <table id="tableHistory" class="data-table">
            <thead>
              <tr><th>Fecha</th><th>Empleado</th><th>Uniforme (ID)</th><th>Cantidad</th><th>Admin</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/core/apiService.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/ui/appController.js"></script>

  <!-- Bloqueo del botón "Atrás" -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = sessionStorage.getItem('sw_user') || localStorage.getItem('sw_user');
      if (user) {
        history.pushState(null, null, location.href);
        window.onpopstate = function () { history.go(1); };
      }
    });
  </script>
</body>
</html>
