<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartWarehouse - Grupo ANC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div class="dashboard-container">
    
    <div class="user-profile">
      <img id="userAvatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar" class="avatar">
      <div class="user-info">
        <strong id="userName">Cargando...</strong>
        <span id="userEmail" class="email">...</span>
      </div>
      <button class="btn-logout" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
    </div>

    <div class="mode-switch">
      <button id="btnTabInv" class="btn-tab active"><i class="fa-solid fa-boxes-stacked"></i> Inventario</button>
      <button id="btnTabMoves" class="btn-tab"><i class="fa-solid fa-right-left"></i> Movimientos</button>
      <button id="btnTabTrash" class="btn-tab"><i class="fa-solid fa-trash-can"></i> Papelera</button>
    </div>

    <!-- PANEL 1: INVENTARIO Y CARGA MASIVA -->
    <section id="panelInv" class="panel active">
      
      <!-- Herramientas de Administrador (Solo visible para ADMIN) -->
      <div id="adminTools" class="hidden" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
        <button class="btn btn-primary" id="btnNewSku" style="flex: 1; min-width: 200px;">
          <i class="fa-solid fa-plus"></i> Registrar Prenda Nueva
        </button>
        <button class="btn" id="btnDownloadTemplate" style="background:#16a34a; color:white; flex: 1; min-width: 200px;">
          <i class="fa-solid fa-download"></i> Descargar Plantilla Excel
        </button>
        <button class="btn" id="btnUploadExcel" style="background:#0ea5e9; color:white; flex: 1; min-width: 200px;">
          <i class="fa-solid fa-file-excel"></i> Subir Excel (Sumar Stock)
        </button>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;">
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
          <h3 style="margin: 0;"><i class="fa-solid fa-boxes-stacked"></i> Stock Actual</h3>
          <input type="text" id="searchInput" placeholder="🔍 Buscar prenda..." style="padding: 8px 15px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; width: 250px;">
        </div>
        <div class="table-responsive">
          <table id="tableInventory" class="data-table">
            <thead>
              <tr><th>ID SKU</th><th>Tipo</th><th>Talla</th><th>Color</th><th>Ubicación</th><th>Stock</th><th class="hidden admin-col">Acciones</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- PANEL 2: MOVIMIENTOS (ENTREGAS) -->
    <section id="panelMoves" class="panel hidden">
      <div class="card" id="formMoveContainer" style="margin-bottom: 25px;">
        <h3><i class="fa-solid fa-hand-holding"></i> Registrar Entrega a Empleado</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>SKU / Prenda</label>
            <select id="moveSkuSelect"></select>
          </div>
          <div class="form-group" style="max-width: 100px;">
            <label>Cantidad</label>
            <input type="number" id="moveQty" value="1" min="1">
          </div>
        </div>
        
        <div id="deliveryFields" class="form-grid" style="margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 15px;">
          <div class="form-group"><label>DNI Empleado</label><input type="text" id="moveDni" placeholder="Ej: 12345678"></div>
          <div class="form-group"><label>Nombres</label><input type="text" id="moveName" placeholder="Ej: Juan"></div>
          <div class="form-group"><label>Apellidos</label><input type="text" id="moveLastname" placeholder="Ej: Perez"></div>
        </div>

        <button class="btn btn-primary" id="btnSaveMove" style="margin-top: 20px; width: 100%; max-width: 250px;">
          <i class="fa-solid fa-floppy-disk"></i> Entregar Prenda
        </button>
      </div>

      <div class="card">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Historial General</h3>
        <div class="table-responsive">
          <table id="tableMoves" class="data-table">
            <thead>
              <tr><th>ID Mov.</th><th>Fecha</th><th>Tipo</th><th>SKU</th><th>Cant.</th><th>DNI</th><th>Empleado</th><th>Admin</th><th>Acción</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- PANEL 3: PAPELERA -->
    <section id="panelTrash" class="panel hidden">
      <div class="card">
        <h3><i class="fa-solid fa-trash-can"></i> Movimientos Anulados</h3>
        <p style="color:var(--text-gray); font-size:0.9rem; margin-bottom:15px;">Recupera entregas anuladas por error.</p>
        <div class="table-responsive">
          <table id="tableTrash" class="data-table">
            <thead>
              <tr><th>ID Mov.</th><th>Fecha</th><th>Tipo</th><th>SKU</th><th>Cant.</th><th>Empleado</th><th>Acción</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

  </div>

  <!-- Modal para Crear/Editar SKU -->
  <div id="modalSku" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:1000;">
    <div class="card" style="width:90%; max-width:500px;">
      <h3 id="modalSkuTitle">Registrar Prenda Nueva</h3>
      <p id="modalSkuId" style="font-size:0.8rem; color:var(--text-gray); margin-bottom:15px; display:none;"></p>
      
      <div class="form-grid">
        <div class="form-group"><label>Tipo</label><input type="text" id="skuType" placeholder="Ej: Camisa"></div>
        <div class="form-group"><label>Talla</label><input type="text" id="skuSize" placeholder="Ej: M"></div>
        <div class="form-group"><label>Color</label><input type="text" id="skuColor" placeholder="Ej: Azul"></div>
        <div class="form-group"><label>Ubicación</label><input type="text" id="skuLocation" placeholder="Ej: Mass-09-01-02-01"></div>
        <div class="form-group"><label>Stock</label><input type="number" id="skuStock" value="0"></div>
      </div>
      
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn" id="btnCancelSku" style="flex:1; background:#e2e8f0; color:var(--text-dark);">Cancelar</button>
        <button class="btn btn-primary" id="btnSaveSku" style="flex:1;">Guardar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/core/apiService.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/ui/appController.js"></script>
</body>
</html>
